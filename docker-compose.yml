version: '3.8'

services:
  # 1. MongoDB Service (החדש!)
  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27018:27017"
    networks:
      - ex3_net
    volumes:
      - mongo_data:/data/db

  # 2. C++ Server
  cpp_server:
    build:
      context: .
      dockerfile: Dockerfile.cpp 
    container_name: cpp_server_container
    ports:
      - "5555:5555"
    networks:
      - ex3_net
    volumes:
      - ./data_files:/app/data_files
    environment:
      - MY_FILE_PATH=/app/data_files
      - THREAD_POOL_SIZE=10

  # 3. Node.js Server
  node_server:
    build:
      context: .
      dockerfile: Dockerfile.node 
    container_name: node_server_container
    ports:
      - "3000:3000"
    networks:
      - ex3_net
    depends_on:
      - cpp_server 
      - mongo # מחכים גם למונגו
    environment:
      - CPP_SERVER_HOST=cpp_server
      - CPP_SERVER_PORT=5555
      # משתנה סביבה כדי שנדע לאן להתחבר
      - MONGO_URI=mongodb://mongo:27017/myDriveDB

  # 4. React Client
  react_client:
    build:
      context: .
      dockerfile: Dockerfile.react
    container_name: react_client_container
    ports:
      - "3001:3000" 
    networks:
      - ex3_net
    depends_on:
      - node_server 
    stdin_open: true 
    tty: true   
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:3000/api
      - WDS_SOCKET_PORT=0 

networks:
  ex3_net:
    driver: bridge

volumes:
  mongo_data: