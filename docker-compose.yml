version: '3.8'

services:
  # 1. MongoDB Service
  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27018:27017"
    networks:
      - ex3_net
    volumes:
      - mongo_data:/data/db

  # 2. C++ Server
  cpp_server:
    build:
      context: .
      dockerfile: Dockerfile.cpp 
    container_name: cpp_server_container
    ports:
      - "5555:5555"
    networks:
      - ex3_net
    volumes:
      - ./data_files:/app/data_files
    environment:
      - MY_FILE_PATH=/app/data_files
      - THREAD_POOL_SIZE=10

  # 3. Node.js Server
  node_server:
    build:
      context: .
      dockerfile: Dockerfile.node 
    container_name: node_server_container
    ports:
      - "8080:3000" # Node moves to 8080 externally
    networks:
      - ex3_net
    depends_on:
      - cpp_server 
      - mongo 
    environment:
      - CPP_SERVER_HOST=cpp_server
      - CPP_SERVER_PORT=5555
      - MONGO_URI=mongodb://mongo:27017/my_drive_db
      - PORT=3000

  # 4. React Native Client (App)
  react_native_client:
    build:
      context: .
      dockerfile: Dockerfile.expo
    container_name: react_client_container
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    networks:
      - ex3_net
    depends_on:
      - node_server
    environment:
      - SERVER_IP=${DETECTED_IP}
    dns:
      - 8.8.8.8
    stdin_open: true
    tty: true

  # 5. React Web Client (Old Website)
  web_client:
    build:
      context: .
      dockerfile: Dockerfile.react # Using your existing file name
    container_name: web_client_container
    ports:
      - "3001:3000" # Website moves to 3001 externally
    networks:
      - ex3_net
    depends_on:
      - node_server
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      # This overrides your .env file automatically:
      - REACT_APP_API_URL=http://localhost:8080/api 
      - WDS_SOCKET_PORT=0

networks:
  ex3_net:
    driver: bridge

volumes:
  mongo_data: {}